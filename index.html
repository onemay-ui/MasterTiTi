<style>

#bGuide{right:196px}#bPack{right:148px}#bQuest{right:100px}#bSfx{right:52px}#bMenu{right:6px}

#hintbar.on{display:flex}
.btn{min-height:48px;padding:6px 16px;border-radius:14px;border:0;background:#e0952b;color:#3b2314;font-weight:900;font-size:16px;box-shadow:0 4px 0 #a96a14;font-family:inherit}

.btn.blue{background:#3c7fc4;color:#fff;box-shadow:0 4px 0 #265a92}

#dlg.on{display:block}
#dlg .who{position:absolute;left:10px;top:-14px;padding:3px 14px;border-radius:12px;background:#b8442f;color:#fff;font-weight:900;font-size:15px}

/* overlay / panels */
#ov{display:none;background:rgba(42,26,18,.55)}
#ov.on{display:block}

.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,96%);max-height:94%;background:#fffdf6;border:5px solid #5b3a29;border-radius:20px;padding:10px 14px;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.3)}
.panel h2{margin:0 0 6px;font-size:20px;color:#b8442f}
.panel .x{position:absolute;right:8px;top:6px}

.title-wrap{position:absolute;inset:0;display:flex}
.grid{display:grid;gap:8px}
.card{background:#fff;border:3px solid #ecdcc4;border-radius:14px;padding:6px 10px}

input[type=text],input[type=number],select{font:inherit;font-size:18px;padding:6px 10px;border-radius:10px;border:3px solid #e0b98a;background:#fff;color:#3b2314;width:100%;min-height:44px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:46px;border-radius:12px;border:3px solid #e0b98a;background:#fff;font:inherit;font-weight:900;font-size:15px;color:#5b3a29;line-height:1.1}

@keyframes cardin{0%{opacity:0;transform:translateY(-14px) rotate(-6deg) scale(.7)}12%{opacity:1;transform:translateY(0) rotate(2deg) scale(1.08)}20%,85%{opacity:1;transform:rotate(0) scale(1)}100%{opacity:0;transform:translateY(-8px)}}
.cardpop{position:absolute;right:14px;top:104px;width:152px;background:#fffdf6;border:4px solid #e0952b;border-radius:14px;padding:5px 6px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:cardin 2.6s both;pointer-events:none;z-index:5}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

<div id="rotate"><div style="font-size:64px;animation:spin 3s linear infinite">📱</div><div>請把手機橫過來玩<br><span class="en" style="font-size:15px">Please rotate your phone.</span></div></div>

<script>
'use strict';
/* ================= 基本工具 ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad2=n=>String(n).padStart(2,'0');

/* ================= 資料(老師可改) =================
   名稱依「英文標籤 香料」PDF 與專業標準表。say 欄位是朗讀用的拼法,不影響畫面。 */
const DATA={
 title:'蹄師傅的祕方箱', titleEn:"Master Ti's Secret Recipe",
 spices:[
  {id:'star_anise',en:'star anise',zh:'八角',syl:'star an-ise'},
  {id:'cinnamon',en:'cinnamon bark',zh:'桂皮',syl:'cin-na-mon bark'},
  {id:'fennel',en:'fennel seeds',zh:'小茴香',syl:'fen-nel seeds'},
  {id:'sand_ginger',en:'sand ginger',zh:'三(山)奈',syl:'sand gin-ger'},
  {id:'tangerine',en:'dried tangerine peel',zh:'陳皮',syl:'dried tan-ge-rine peel'},
  {id:'licorice',en:'licorice root',zh:'甘草',syl:'lic-o-rice root'},
  {id:'sichuan',en:'Sichuan peppercorns',zh:'花椒粒',syl:'Si-chuan pep-per-corns'},
  {id:'tsaoko',en:'tsaoko',zh:'草果',syl:'tsao-ko',say:'chow koh'},
  {id:'angelica',en:'angelica root',zh:'白芷',syl:'an-gel-i-ca root'},
  {id:'galangal',en:'galangal',zh:'南薑',syl:'ga-lan-gal'},
  {id:'shallots',en:'fried shallots',zh:'油蔥酥',syl:'fried shal-lots'}
 ],
 bagWord:'spice bag', bagZh:'香料袋',
 /* 更衣室教學關:聽指令,走到對的物品按操作 */
 cmds:[
  {id:'hairnet',say:'Put on your hairnet.',zh:'戴上髮網。',obj:'hairnet'},
  {id:'wash',say:'Wash your hands.',zh:'洗手。',obj:'sink'},
  {id:'gloves',say:'Put on your gloves.',zh:'戴上手套。',obj:'gloves'},
  {id:'timer',say:'Check the timer.',zh:'檢查計時器。',obj:'timer'}
 ],
 /* 句子組塊(聽整句,把詞塊排成句子)。d = 干擾詞塊 */
 sentences:[
  {c:['Wash','your hands'],zh:'洗手。',d:['your gloves']},
  {c:['Put on','your gloves'],zh:'戴上手套。',d:['your hands']},
  {c:['Check','the timer'],zh:'檢查計時器。',d:['the pot']},
  {c:['Put','the spice bag','in the pot'],zh:'把香料袋放進鍋子。',d:['on the scale']},
  {c:['Weigh','the star anise','on the scale'],zh:'在電子秤上秤八角。',d:['in the pot']},
  {c:['Put','the pig\'s feet','in cold water'],zh:'把豬腳放進冷水。',d:['in hot water']},
  {c:['Check','the ginger','and the green onion'],zh:'檢查薑和青蔥。',d:['and the garlic']},
  {c:['Please','close','the lid'],zh:'請把鍋蓋蓋好。',d:['open']},
  {c:['Turn on','the stove','slowly'],zh:'慢慢打開爐火。',d:['quickly']},
  {c:['Wait','for','fifteen minutes'],zh:'等十五分鐘。',d:['five minutes']}
 ],
 /* 鼓勵語(中英並用) */
 cheerGood:[['Nice catch!','接得好!'],['Great job!','做得好!'],['Well done!','很棒!'],['Perfect!','完美!'],['You got it!','你答對了!'],['Awesome!','太厲害了!'],['Keep going!','繼續加油!']],
 cheerTry:[['Almost!','差一點!'],['Try again!','再試一次!'],['Listen again!','再聽一次!'],['Good try!','很努力!'],['You can do it!','你可以的!']],
 cheerCombo:[[3,'Nice streak!','連擊中!'],[5,'On fire!','火力全開!'],[8,'Unstoppable!','擋不住了!'],[12,'Master level!','大師級!']],
 /* 新進員工:口說三題 */
 speakNewbie:[
  {id:'n1',masterSay:'First wash your hands, then put on your gloves, check the timer and bring the spice bag.',masterZh:'先洗手,再戴手套,檢查計時器,拿香料袋。',
   model:"Sorry, please say it again.",modelZh:'抱歉,請再說一次。',task:'師傅說得太快了,請有禮貌地請他再說一次。',
   keys:['say','again'],pattern:/please/,content:t=>/again/.test(t)&&/say/.test(t),extra:/(sorry|excuse me|pardon)/,extraLabel:'先說 Sorry'},
  {id:'n2',masterSay:'First, wash your hands. Then, put on your gloves.',masterZh:'先洗手,再戴手套。',
   model:"First, I wash my hands. Then, I put on my gloves. Is that right?",modelZh:'先,我洗手。然後,我戴手套。這樣對嗎?',task:'用 First…Then… 複誦師傅的指令(Teach-back)。',
   keys:['first','wash','hands','then','gloves'],pattern:/first.*then/,content:t=>{const a=t.indexOf('wash'),b=t.indexOf('glove');return a>=0&&b>a;},extra:/(is that right|is that ok|is that okay|correct|understand)/,extraLabel:'最後問 Is that right?'},
  {id:'n3',masterSay:'Is everything ready?',masterZh:'一切都準備好了嗎?',
   model:"Yes, the spice bag and the ginger are ready. Can I start?",modelZh:'好了,香料袋和薑都準備好了。我可以開始了嗎?',task:'回報師傅:你備好了什麼。',
   keys:['ready','spice bag','ginger'],pattern:/^(yes|yeah|ok|okay|sure)\b/,content:t=>/ready/.test(t)&&/(spice bag|ginger|green onion|pig|gloves|timer|pot|scale)/.test(t),extra:/(can i|may i|let'?s|please)/,extraLabel:'加一句 Can I start?'}
 ],
 /* 資深員工:教新同事 Ann */
 speakSenior:[
  {id:'s1',obj:'sink',act:'wash',cardZh:'請新同事洗手',icon:'🚿',model:'Please wash your hands.',modelZh:'請洗手。',
   keys:['wash','hands'],pattern:/(please|first|now|can you|could you)/,content:t=>/wash/.test(t)&&/hand/.test(t),extra:/(food safety|safe|clean|because)/,extraLabel:'加原因 food safety'},
  {id:'s2',obj:'gloves',act:'gloves',cardZh:'請新同事戴手套',icon:'🧤',model:'Please put on your gloves.',modelZh:'請戴上手套。',
   keys:['put','gloves'],pattern:/(please|first|now|can you|could you)/,content:t=>/glove/.test(t)&&/(put|wear)/.test(t),extra:/(food safety|safe|clean|because)/,extraLabel:'加原因 food safety'},
  {id:'s3',obj:'timer',act:'timer',cardZh:'請新同事把計時器設成 15 分鐘(預習滷製區)',icon:'⏱️',model:'Please set the timer for fifteen minutes.',modelZh:'請把計時器設成十五分鐘。',
   keys:['timer','fifteen'],pattern:/(please|first|now|can you|could you)/,content:(t,n)=>/timer/.test(t)&&n.indexOf(15)>=0,extra:/(blood|smell|because|remove)/,extraLabel:'加原因 to remove the blood'},
  {id:'s4',obj:'pot',act:'spice',cardZh:'請新同事把香料袋放進鍋子',icon:'🍲',model:'Please put the spice bag in the pot.',modelZh:'請把香料袋放進鍋子。',
   keys:['spice bag','pot','put'],pattern:/(please|first|now|then|can you|could you)/,content:t=>/spice bag/.test(t)&&/pot/.test(t),extra:/(then|and|boil|wait)/,extraLabel:'加 then…'},
  {id:'s5',obj:'pot',act:'careful',cardZh:'提醒新同事:鍋子很燙!',icon:'🔥',model:"Be careful. It's hot!",modelZh:'小心,很燙!',
   keys:['careful','hot'],pattern:/(be careful|watch out)/,content:t=>/hot/.test(t)&&/(careful|watch)/.test(t),extra:/(please|wait|stay|don'?t touch|do not touch)/,extraLabel:'加 Please wait.'}
 ],
 equip:[['hairnet','髮網'],['gloves','手套'],['timer','計時器'],['sink','洗手台'],['pot','鍋子'],['scale','電子秤'],['spice bag','香料袋'],['stove','爐子']],
 /* 更衣櫃:金幣換外觀 */
 cosHat:[{id:'blue',zh:'藍色',en:'blue',p:0,f:'rgba(120,200,250,.88)',s:'#4aa3df'},{id:'pink',zh:'粉紅',en:'pink',p:30,f:'rgba(255,170,200,.9)',s:'#e8709c'},{id:'green',zh:'綠色',en:'green',p:30,f:'rgba(140,215,150,.9)',s:'#3f9d6a'},{id:'yellow',zh:'黃色',en:'yellow',p:40,f:'rgba(255,224,110,.92)',s:'#d9a400'},{id:'purple',zh:'紫色',en:'purple',p:40,f:'rgba(190,150,235,.9)',s:'#8b5cc6'},{id:'red',zh:'紅色',en:'red',p:50,f:'rgba(245,130,120,.92)',s:'#c9493d'},{id:'gold',zh:'金色',en:'gold',p:120,f:'rgba(255,205,70,.95)',s:'#b58400'}],
 cosApron:[{id:'none',zh:'不穿',en:'none',p:0,f:null},{id:'red',zh:'紅色',en:'red',p:40,f:'#d8584a'},{id:'green',zh:'綠色',en:'green',p:40,f:'#4caf7a'},{id:'yellow',zh:'黃色',en:'yellow',p:40,f:'#f2c14e'},{id:'navy',zh:'深藍',en:'navy',p:40,f:'#3a5a8c'},{id:'pink',zh:'粉紅',en:'pink',p:40,f:'#f08cae'},{id:'gold',zh:'金色',en:'gold',p:120,f:'#e0a52a'}],
 starLabels:['開口說了','說到關鍵字','用對句型','內容正確','加碼一句']
};
DATA.spices.forEach(s=>{s.sylArr=s.syl.split(' ').map(w=>w.split('-'));s.sylFlat=[].concat.apply([],s.sylArr);});
const spiceById=id=>DATA.spices.find(s=>s.id===id);

/* ================= 存檔(只存在本機) ================= */
const Store={
 key:'tiSecretBox_v1',data:null,
 load(){let d=null;try{d=JSON.parse(localStorage.getItem(this.key));}catch(e){d=null;}
  if(!d||typeof d!=='object')d={};
  d.profile=d.profile||{seat:'',nick:'',cls:''};d.diff=d.diff||'normal';d.role=d.role||'newbie';
  d.unlock=d.unlock||{senior:false};d.cleared=d.cleared||{};d.games=d.games||{};d.speak=d.speak||{};d.spiceSeen=d.spiceSeen||{};d.plays=d.plays||{};d.bank=d.bank||0;d.cos=d.cos||{hat:'blue',apron:'none'};d.owned=d.owned||{hat:['blue'],apron:['none']};
  this.data=d;return d;},
 save(){try{localStorage.setItem(this.key,JSON.stringify(this.data));}catch(e){}}
};

/* ================= 音效(合成) ================= */
const SFX={
 ctx:null,on:true,
 init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C();}catch(e){this.ctx=null;}this.resume();},
 resume(){try{if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}catch(e){}},
 tone(f,d,type,v,delay,slide){
  if(!this.on||!this.ctx)return;
  try{const c=this.ctx,t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();
   o.type=type||'sine';o.frequency.setValueAtTime(f,t);
   if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
   g.gain.setValueAtTime(v||.14,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
   o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);}catch(e){}
 },
 play(n,v){
  if(!this.on||!this.ctx)return;this.resume();
  switch(n){
   case'combo':{const k=Math.min(v||1,10);[0,4,7].forEach((st,i)=>this.tone(523*Math.pow(2,(st+k)/12),.16,'triangle',.13,i*.06));break;}
   case'jump':this.tone(420,.16,'square',.06,0,420);break;
   case'pop':this.tone(900,.05,'square',.09);this.tone(300,.12,'sawtooth',.06,.02,-150);break;
   case'miss':this.tone(330,.12,'triangle',.07,0,-120);break;
   case'life':this.tone(300,.2,'sawtooth',.1,0,-200);this.tone(200,.3,'sawtooth',.1,.12,-100);break;
   case'golden':[1046,1318,1568,2093].forEach((f,i)=>this.tone(f,.14,'sine',.13,i*.05));break;
   case'ding':this.tone(880,.18,'sine',.16);this.tone(1320,.3,'sine',.14,.09);break;
   case'good':[523,659,784,1046].forEach((f,i)=>this.tone(f,.2,'triangle',.14,i*.07));break;
   case'bad':this.tone(220,.28,'sawtooth',.1,0,-120);break;
   case'coin':this.tone(1175,.1,'square',.07);this.tone(1568,.22,'square',.07,.08);break;
   case'tap':this.tone(660,.06,'triangle',.1);break;
   case'door':this.tone(200,.5,'sine',.16,0,-110);this.tone(130,.4,'square',.05,.15);break;
   case'whoosh':this.tone(300,.25,'sawtooth',.05,0,500);break;
   case'water':for(let i=0;i<6;i++)this.tone(500+Math.random()*500,.08,'sine',.04,i*.06);break;
   case'beep':this.tone(1000,.1,'square',.07);this.tone(1000,.1,'square',.07,.16);break;
   case'fan':[523,659,784,659,784,1046].forEach((f,i)=>this.tone(f,.28,'triangle',.15,i*.12));break;
   case'mic':this.tone(700,.08,'sine',.1);this.tone(1000,.12,'sine',.1,.08);break;
  }
 }
};

/* ================= 朗讀 TTS ================= */
const VOICE={master:{rate:.82,pitch:.72},ann:{rate:.95,pitch:1.3},ti:{rate:1.02,pitch:1.6},narr:{rate:.88,pitch:1},model:{rate:.78,pitch:1}};
const TTS={
 voice:null,hasEnglish:true,tried:false,speaking:false,
 init(){
  if(!('speechSynthesis' in window)){this.hasEnglish=false;return;}
  const load=()=>{try{const vs=speechSynthesis.getVoices()||[];if(!vs.length)return;
   const en=vs.filter(v=>/^en[-_]US/i.test(v.lang));const any=vs.filter(v=>/^en/i.test(v.lang));
   const pref=en.find(v=>/Samantha|Google US English|Aria|Jenny|Alex|Zira/i.test(v.name));
   this.voice=pref||en[0]||any[0]||null;this.hasEnglish=!!this.voice;}catch(e){}};
  load();try{speechSynthesis.onvoiceschanged=load;}catch(e){}
  setTimeout(load,800);
 },
 cancel(){try{speechSynthesis.cancel();}catch(e){}this.speaking=false;},
 speak(text,who,rate){
  return new Promise(res=>{
   if(!('speechSynthesis' in window)||!text){res();return;}
   try{
    speechSynthesis.cancel();
    const p=VOICE[who||'narr']||VOICE.narr;
    setTimeout(()=>{
     const u=new SpeechSynthesisUtterance(text);u.lang='en-US';if(this.voice)u.voice=this.voice;
     u.rate=rate||p.rate;u.pitch=p.pitch;
     let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(tm);this.speaking=false;res();};
     u.onend=fin;u.onerror=fin;
     const tm=setTimeout(fin,1200+text.length*120/(u.rate||1));
     this.speaking=true;speechSynthesis.speak(u);
    },60);
   }catch(e){res();}
  });
 }
};

/* ================= 語音辨識(輔助) ================= */
const ASR={
 Ctor:window.SpeechRecognition||window.webkitSpeechRecognition,
 inApp:/Line\/|FBAN|FBAV|Instagram|MicroMessenger|FB_IAB|; wv\)/i.test(navigator.userAgent),
 failed:false,
 supported(){return !!this.Ctor&&!this.inApp&&!this.failed;},
 stopNow(){try{this._r&&this._r.stop();}catch(e){}},
 listen(onInterim){
  return new Promise(res=>{
   let fin=false,tm=null,tmMax=null,tmSil=null,segs=[],lastAlts=[],interim='',r=null,heard=false;
   const SIL=2200,FIRST=8000,MAX=16000;
   const done=o=>{if(fin)return;fin=true;clearTimeout(tm);clearTimeout(tmMax);clearTimeout(tmSil);try{r&&r.stop();}catch(e){}res(o);};
   const finish=()=>{
    const pre=segs.slice(0,-1).join(' ').trim();
    const full=(segs.join(' ')+' '+interim).trim();
    if(!full){done({ok:false,transcript:'',alts:[''],error:'no-speech'});return;}
    const alts=[full];
    if(segs.length&&!interim){lastAlts.forEach(a=>{const v=(pre+' '+a).trim();if(alts.indexOf(v)<0)alts.push(v);});}
    done({ok:true,transcript:full,alts:alts,error:null});
   };
   try{
    r=new this.Ctor();this._r=r;r.lang='en-US';r.interimResults=true;r.maxAlternatives=3;r.continuous=true;
    r.onresult=e=>{
     segs=[];interim='';
     for(let i=0;i<e.results.length;i++){const rs=e.results[i];
      if(rs.isFinal){segs.push(rs[0].transcript.trim());lastAlts=[];for(let k=0;k<rs.length;k++)lastAlts.push(rs[k].transcript.trim());}
      else interim+=rs[0].transcript;}
     heard=true;clearTimeout(tm);clearTimeout(tmSil);tmSil=setTimeout(()=>{try{r.stop();}catch(e){}},SIL);
     if(onInterim)onInterim((segs.join(' ')+' '+interim).trim());};
    r.onerror=e=>{const er=e&&e.error||'error';if(er==='no-speech'||er==='aborted'){finish();return;}
     if(er==='not-allowed'||er==='service-not-allowed'||er==='audio-capture')ASR.failed=true;done({ok:false,error:er});};
    r.onend=()=>finish();
    tm=setTimeout(()=>{try{r.stop();}catch(e){}},FIRST);
    tmMax=setTimeout(()=>{try{r.stop();}catch(e){}},MAX);
    r.start();
   }catch(err){ASR.failed=true;done({ok:false,error:'start-failed'});}
  });
 }
};

/* ================= 口說評分(五星,輔助用) ================= */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,
 'fifty':50};
function norm(s){return(' '+String(s||'').toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim()+' ');}
function squash(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'');}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;
 for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}p=c;}return p[n];}
function hasKey(t,key){
 const sq=squash(t),kk=squash(key);if(kk&&sq.includes(kk))return true;
 if(key.indexOf(' ')<0){const ws=t.trim().split(' ');const tol=kk.length>=7?2:kk.length>=5?1:0;
  if(tol>0)return ws.some(w=>w.length>=3&&Math.abs(w.length-kk.length)<=tol&&lev(w,kk)<=tol);}
 return false;
}
function numsIn(t){const out=[];t.trim().split(' ').forEach(w=>{if(/^\d+$/.test(w))out.push(parseInt(w,10));else if(NUMW.hasOwnProperty(w))out.push(NUMW[w]);});return out;}
function scoreOne(spec,txt){
 const t=norm(txt),words=t.trim()?t.trim().split(' ').length:0;
 const f=[false,false,false,false,false];
 f[0]=words>=1;
 if(f[0]){
  const need=Math.max(1,Math.ceil(spec.keys.length*0.6));
  f[1]=spec.keys.filter(k=>hasKey(t,k)).length>=need;
  f[2]=spec.pattern?spec.pattern.test(t.trim()):words>=3;
  try{f[3]=spec.content?!!spec.content(t,numsIn(t)):false;}catch(e){f[3]=false;}
  f[4]=spec.extra?spec.extra.test(t):false;
 }
 return{stars:f.filter(Boolean).length,flags:f,text:txt,t:t};
}
function evalSpeech(spec,alts){
 let best=null;(alts||[]).forEach(a=>{if(!a)return;const r=scoreOne(spec,a);if(!best||r.stars>best.stars)best=r;});
 return best||{stars:0,flags:[false,false,false,false,false],text:'',t:' '};
}

function updateWorld(dt,t){

 let dir=0;if(!G.lock&&G.scene==='world'){if(Input.l)dir-=1;if(Input.r)dir+=1;}
 p.walking=dir!==0;
 if(dir){p.facing=dir;p.x+=dir*150*dt;}
 let maxX=WORLD_W-40;if(G.st.doorOpen<0.9)maxX=Math.min(maxX,1085);if(!G.st.gateOpen)maxX=Math.min(maxX,2435);
 p.x=clamp(p.x,40,maxX);
 G.st.doorOpen+=((G.doorTarget||0)-G.st.doorOpen)*Math.min(1,dt*3.5);
 if(G.st.water>0)G.st.water-=dt;
 G.npcs.forEach(n=>{
  if(n.follow){const want=p.x-72*(p.facing||1);n.tx=clamp(want,40,maxX);if(Math.abs(n.tx-n.x)<46)n.tx=n.x;}
  const dx=n.tx-n.x;
  if(Math.abs(dx)>3){n.walking=true;n.facing=dx>0?1:-1;n.x+=Math.sign(dx)*Math.min(Math.abs(dx),n.speed*dt);}else{n.walking=false;}
 });
 // 鏡頭
 const maxCam=WORLD_W-W;
 const target=G.focusX!=null?G.focusX-230:p.x-330;
 G.cam+=(clamp(target,0,maxCam)-G.cam)*Math.min(1,dt*5);
 // 最近互動物件
 let best=null,bd=1e9;
 if(!G.lock&&G.scene==='world'){
  G.objs.forEach(o=>{if(typeof Flow!=='undefined'&&Flow.isActive&&!Flow.isActive(o))return;const d=Math.abs(objX(o)-p.x);if(d<=o.range&&d<bd){bd=d;best=o;}});
 }
 if(best!==G.near){G.near=best;if(best)UI.act((best.icon||'👆')+'<br>'+(best.label||best.zh),()=>Flow.use(best.id));else UI.act(null);}

}

 drawWorldBG(c,560,t,{doorOpen:0,noClock:true});
 c.save();c.translate(-560,0);
 drawChar(c,'master',700,GROUND+8,{t:t,talk:Math.sin(t*.7)>.6,mood:'happy',ladle:true,scale:1.35,facing:1});
 drawChar(c,'player',860,GROUND+8,{t:t,hairnet:true,gloves:true,mood:'happy',scale:1.15,facing:-1,raise:0});
 drawChar(c,'ti',600,GROUND+12,{t:t,scale:1.2});

/* 主迴圈 */
let _last=0;
function frame(ts){
 const t=ts/1000,dt=Math.min(0.05,t-_last||0.016);_last=t;
 try{
  if(G.scene==='title')drawTitle(t);
  else if(G.scene==='catch'){Catch.update(dt,t);Catch.draw(t);}
  else if(G.scene==='relax'){Relax.update(dt,t);Relax.draw(t);}
  else{updateWorld(dt,t);drawWorld(t);}
 }catch(e){console.error('frame error',e);}
 requestAnimationFrame(frame);
}

/* ================= 小遊戲 1:接香料(聽音選字) ================= */
const Catch={
 st:null,
 HZ:['🪰','🧤'],
 speakTarget(){const sp=this.st.target;if(!sp)return Promise.resolve();this.st.speaking=true;return TTS.speak(sp.say||sp.en,'narr',0.8).then(()=>{if(this.st)this.st.speaking=false;});},
 async run(){
  const total=12,setN=4;
  const n={easy:4,normal:5,hard:6}[G.diff]||5,vy={easy:72,normal:105,hard:140}[G.diff]||105,hz={easy:0,normal:1,hard:2}[G.diff]||1;
  const order=shuffle(DATA.spices).concat(shuffle(DATA.spices)).slice(0,total);
  const st=this.st={items:[],bx:W/2,phase:'idle',round:0,rounds:total,got:0,target:null,tFall:0,msg:null,resolveRound:null,speaking:false,fallTime:(GROUND+60+125)/vy,flash:0,quit:false,lives:3,set:1,sets:total/setN,shake:0};
  G.scene='catch';G.lock=true;UI.act(null);UI.showPad(true);UI.closeModal();
  const score0=G.score;
  UI.banner('🧺 接香料 Catch the Spices');
  await sleep(900);
  for(let r=0;r<total&&!st.quit;r++){
   if(r%setN===0){st.lives=3;st.set=r/setN+1;if(r>0){UI.banner('第 '+st.set+' 組 ・ Set '+st.set);SFX.play('fan');await sleep(900);}}
   st.round=r;const sp=order[r];st.target=sp;st.items=[];st.msg=null;st.phase='listen';
   UI.hint(true,()=>{SFX.init();this.speakTarget();},()=>{UI.toast(sp.zh+'  =  '+sp.en);});
   await this.speakTarget();
   if(st.quit)break;
   const others=shuffle(DATA.spices.filter(s=>s.id!==sp.id)).slice(0,n-1);
   const list=shuffle([sp].concat(others)).map(s=>({kind:'spice',sp:s}));
   const hazN=(r%setN===0)?0:hz;
   for(let i=0;i<hazN;i++)list.push({kind:'hazard',em:this.HZ[(r+i)%2]});
   if((r%setN===1||r%setN===3)&&Math.random()<.55)list.push({kind:'gold',sp:pick(DATA.spices.filter(s=>s.id!==sp.id))});
   const L=shuffle(list),slotW=(W-120)/L.length;
   L.forEach((o,i)=>{o.x=60+slotW*(i+.5)+rnd(-slotW*.12,slotW*.12);o.y=(i%2?-105:-30)-rnd(0,20);o.vy=vy*rnd(.95,1.08);o.rot=rnd(-.3,.3);o.done=false;st.items.push(o);});
   st.phase='fall';st.tFall=0;
   const res=await new Promise(rs=>{st.resolveRound=rs;});
   if(st.quit)break;
   st.phase='between';
   if(res.ok){st.got++;Collect.add(sp.id);await sleep(700);}
   else{
    st.lives--;SFX.play('life');
    Game.mistake(sp.id);st.msg=sp;this.st.speaking=true;await TTS.speak(sp.say||sp.en,'narr',0.75);st.speaking=false;await sleep(900);
   }
   if(st.lives<=0&&(r%setN)!==setN-1){
    st.msg=null;UI.toast('💔 這一組結束了,休息一下,下一組加油!');await sleep(1200);r=(Math.floor(r/setN)+1)*setN-1;
   }
  }
  UI.hint(false);
  const result={c:st.got,t:total,score:G.score-score0,quit:st.quit};
  this.st=null;
  return result;
 },
 update(dt,t){
  const st=this.st;if(!st)return;
  if(Input.l)st.bx-=330*dt;if(Input.r)st.bx+=330*dt;st.bx=clamp(st.bx,50,W-50);
  stepParticles(dt);
  if(st.flash>0)st.flash-=dt;if(st.shake>0)st.shake-=dt;
  if(st.phase!=='fall')return;
  st.tFall+=dt;
  let pending=false;
  st.items.forEach(it=>{
   if(it.done)return;
   it.y+=it.vy*dt;it.rot+=dt*.6*Math.sin(it.x);
   if(it.y>318&&it.y<366&&Math.abs(it.x-st.bx)<56){
    it.done=true;
    if(it.kind==='hazard'){
     st.lives--;G.combo=0;UI.refresh();SFX.play('life');UI.popup('Yuck! 💔',it.x,290,'bad');st.shake=.3;
     if(st.lives<=0){st.items.forEach(o=>{o.done=true;});const f=st.resolveRound;st.resolveRound=null;st.lives++;f&&f({ok:false,got:'hazard'});}
     return;
    }
    if(it.kind==='gold'){Game.gold(15);SFX.play('golden');UI.popup('+15 🪙 Bonus!',it.x,290);confetti(it.x,300,16);return;}
    if(it.sp.id===st.target.id){
     const bonus=Math.round(clamp(1-st.tFall/st.fallTime,0,1)*40);
     Game.right(100+bonus,it.x,300);st.flash=.4;confetti(it.x,300,14);st.items.forEach(o=>{o.done=true;});
     const f=st.resolveRound;st.resolveRound=null;f&&f({ok:true,got:it.sp.id});
    }else{
     Game.wrong(it.x,300);st.flash=.4;st.items.forEach(o=>{o.done=true;});
     const f=st.resolveRound;st.resolveRound=null;f&&f({ok:false,got:it.sp.id});
    }
    return;
   }
   if(it.y<GROUND+70)pending=true;else it.done=true;
  });
  if(st.phase==='fall'&&!pending&&st.resolveRound){
   const f=st.resolveRound;st.resolveRound=null;Game.wrong();SFX.play('miss');f({ok:false,got:null});
  }
 },
 draw(t){
  const st=this.st,c=ctx;c.setTransform(Q,0,0,Q,0,0);c.clearRect(0,0,W,H);
  drawWorldBG(c,1180,t,{doorOpen:1,gateOpen:false});
  c.fillStyle='rgba(255,246,229,.35)';c.fillRect(0,0,W,H);
  if(!st)return;
  const cx=W/2;
  // 頂端:聽力提示
  rr(c,cx-95,8,190,40,20);c.fillStyle='rgba(59,35,20,.88)';c.fill();
  c.font='900 22px sans-serif';c.textAlign='center';c.fillStyle='#fff6e5';
  c.fillText((st.speaking?'🔊 Listen…':'🎧 Catch it!'),cx,36);
  // 第二列:生命、組別、進度
  rr(c,cx-150,52,300,24,12);c.fillStyle='rgba(59,35,20,.78)';c.fill();
  c.font='800 13px sans-serif';c.textAlign='left';c.fillStyle='#fff6e5';c.fillText('第'+st.set+'組',cx-140,69);
  for(let i=0;i<3;i++){c.font='15px sans-serif';c.fillStyle=i<st.lives?'#ff6b6b':'#6f5a4c';c.fillText(i<st.lives?'❤':'♡',cx-98+i*18,70);}
  for(let i=0;i<st.rounds;i++){c.fillStyle=i<st.round?'#3f9d6a':(i===st.round?'#ffd23f':'#9b8a78');circ(c,cx-30+i*11,64,3.8);c.fill();}
  // 道具
  st.items.forEach(it=>{
   if(it.done&&st.phase!=='fall')return;
   c.save();c.translate(it.x,it.y);c.globalAlpha=it.done?.25:1;
   if(it.kind==='hazard'){
    c.font='38px sans-serif';c.textAlign='center';c.textBaseline='middle';c.rotate(Math.sin(t*6+it.x)*.25);c.fillText(it.em,0,0);c.textBaseline='alphabetic';
   }else{
    const gold=it.kind==='gold';
    if(gold){c.fillStyle='rgba(255,226,120,'+(.45+.25*Math.sin(t*8))+')';circ(c,0,0,42);c.fill();}
    c.fillStyle='rgba(255,255,255,.94)';c.strokeStyle=gold?'#ffb800':'#e0b98a';c.lineWidth=gold?4:3;circ(c,0,0,31);c.fill();c.stroke();
    c.rotate(it.rot);drawSpice(c,it.sp.id,0,0,24);c.rotate(-it.rot);
    const label=gold?'BONUS 🪙':it.sp.en;
    c.font='800 12px Verdana';const w=c.measureText(label).width+12;
    rr(c,-w/2,34,w,18,9);c.fillStyle=gold?'#ffe08a':'rgba(255,255,255,.96)';c.fill();c.strokeStyle='#d9b88a';c.lineWidth=1.5;c.stroke();
    c.fillStyle='#3b2314';c.textAlign='center';c.fillText(label,0,47);
   }
   c.restore();
  });
  // 籃子
  const bx=st.bx+(st.shake>0?Math.sin(t*60)*4:0),by=336;
  c.save();c.translate(bx,by);
  c.fillStyle='#c98a4b';c.strokeStyle='#8a5a2a';c.lineWidth=3;c.beginPath();c.moveTo(-58,0);c.lineTo(58,0);c.lineTo(44,40);c.lineTo(-44,40);c.closePath();c.fill();c.stroke();
  c.strokeStyle='#a56d34';c.lineWidth=2;for(let i=-40;i<=40;i+=14){c.beginPath();c.moveTo(i,2);c.lineTo(i*0.8,38);c.stroke();}c.beginPath();c.moveTo(-52,18);c.lineTo(52,18);c.stroke();
  c.fillStyle='#a56d34';rr(c,-62,-6,124,10,5);c.fill();
  if(st.flash>0){c.fillStyle='rgba(255,230,120,'+st.flash+')';circ(c,0,-4,60);c.fill();}
  c.restore();
  // 失敗時顯示正解
  if(st.msg){
   rr(c,cx-175,110,350,124,20);c.fillStyle='rgba(255,253,246,.96)';c.fill();c.strokeStyle='#b8442f';c.lineWidth=4;c.stroke();
   drawSpice(c,st.msg.id,cx-115,172,36);
   c.fillStyle='#b8442f';c.font='900 14px sans-serif';c.textAlign='left';c.fillText('正確的是:',cx-65,134);
   c.fillStyle='#3b2314';c.font='900 22px Verdana';c.fillText(st.msg.en,cx-65,162);
   c.font='900 18px sans-serif';c.fillStyle='#5b3a29';c.fillText(st.msg.zh,cx-65,188);
   c.font='700 12px Verdana';c.fillStyle='#8a6a55';c.fillText(st.msg.syl.replace(/ /g,'  ').replace(/-/g,'·'),cx-65,212);
  }
  stepParticles(0,c);
  if(st.round<2){c.save();rr(c,cx-120,82,240,20,10);c.fillStyle='rgba(59,35,20,.8)';c.fill();c.fillStyle='#fff6e5';c.font='700 12px sans-serif';c.textAlign='center';c.fillText('左右拖曳或按 ◀ ▶ 移動籃子,躲開蒼蠅!',cx,96);c.restore();}
 }
};

(function(){

const Syl={
 quit:false,
 async run(){
  this.quit=false;G.lock=true;UI.act(null);UI.hint(false);
  const words=shuffle(DATA.spices).slice(0,this.count||10);const score0=G.score;let c=0;

   const extra=({easy:0,normal:1,hard:2}[G.diff]||1);
   const pool=shuffle([].concat.apply([],DATA.spices.filter(s=>s.id!==sp.id).map(s=>s.sylFlat)).filter((s,i,a)=>a.indexOf(s)===i&&flat.indexOf(s)<0)).slice(0,extra);

   const top=$('#synTop',root);top.innerHTML='';

   sp.sylArr.forEach(wd=>{const g=h('div','');g.style.cssText='display:flex;gap:6px';wd.forEach(()=>{const s=h('div','en');s.style.cssText='min-width:76px;height:62px;border:3px dashed #d3b48a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#fff9ec;padding:0 6px';g.appendChild(s);slotEls.push(s);});slotsBox.appendChild(g);});
   top.appendChild(slotsBox);

   const colors=['#e0952b','#d4663f','#3f9d6a','#3c7fc4','#9b6bd0','#c9496b','#2f9aa0'];

   $('#synZh',root).onclick=()=>{if(G.coins>=5){G.coins-=5;UI.refresh();}G.hints.zh++;msg.textContent='💡 '+sp.zh+'  ('+sp.syl.replace(/ /g,' · ')+')';};
   TTS.speak(sp.say||sp.en,'narr',.8);
   await doneP;

 }

 }

 async useSenior(id){
  if(id==='gate'){await this.finishLevel();return;}

 },
 async instruct(T){
  const ann=getNpc('ann'),ob=G.objs.find(o=>o.id===T.obj);
  ann.follow=false;ann.tx=ob.x-80;await this.until(()=>Math.abs(ann.x-ann.tx)<5,4000);ann.facing=1;
  G.focusX=ob.x+30;await sleep(450);
  const pool=DATA.speakSenior.filter(s=>s.id!==T.id);const wrongs=shuffle(pool).slice(0,2);
  const choices=shuffle([{text:T.model,correct:true,act:T.act}].concat(wrongs.map(w=>({text:w.model,correct:false,act:w.act}))));
  await Speak.run(T,{kind:'senior',icon:T.icon,cardZh:T.cardZh,progress:(G.taskIdx+1)+' / '+G.tasks.length,choices:choices,onAttempt:ev=>this.annAct(T,ev)});
  G.focusX=null;ann.follow=true;ann.mood='ok';ann.thumb=false;ann.q=false;
  G.taskIdx++;
  if(G.taskIdx<G.tasks.length){G.curTask=G.tasks[G.taskIdx];G.hintObj=G.curTask.obj;UI.toast('➡ 下一站:'+G.curTask.cardZh);}
  else{
   G.curTask=null;G.hintObj='gate';G.st.gateOpen=true;SFX.play('door');confetti(G.player.x,GROUND-100,40);UI.banner('🔑 通關門打開了!');
   await UI.say('ann','Thank you, teacher! I understand now.','謝謝老師!我懂了。');
   UI.toast('到大門拿鑰匙吧!');
  }
 },
 decide(T,ev){
  const t=ev.t||norm(ev.text||'');
  if(!ev.stars||!t.trim())return{kind:'confused'};
  const nums=numsIn(t);
  const acts={wash:/wash|hands?\b/,gloves:/gloves?/,timer:/timer|minutes?/,spice:/spice|bag|\bpot\b/,careful:/careful|\bhot\b|watch/};
  if(acts[T.act].test(t)){
   if(T.act==='timer'){if(nums.indexOf(15)>=0)return{kind:'ok'};if(nums.length)return{kind:'wrong',act:'timer',num:nums[0]};return{kind:'confused'};}
   return(ev.flags[1]||ev.flags[3])?{kind:'ok'}:{kind:'confused'};
  }
  for(const k in acts){if(k!==T.act&&acts[k].test(t))return{kind:'wrong',act:k,num:nums.length?nums[0]:null};}
  return{kind:'confused'};
 },
 async annAct(T,ev){
  const ann=getNpc('ann');
  let dec;
  if(ev.fb)dec=ev.choice.correct?{kind:'ok'}:{kind:'wrong',act:ev.choice.act};else dec=this.decide(T,ev);
  ann.q=false;ann.mood='ok';ann.thumb=false;
  if(dec.kind==='confused'){
   ann.q=true;ann.mood='oops';G.talk='ann';await TTS.speak('Sorry? Please say it again.','ann');G.talk=null;await sleep(300);ann.q=false;ann.mood='ok';return;
  }
  const act=dec.kind==='ok'?T.act:dec.act;
  await this.annDo(act,dec);
  if(dec.kind==='ok'){
   G.sOK[T.id]=true;ann.mood='happy';ann.thumb=true;SFX.play('good');confetti(ann.x,GROUND-100,18);
   G.talk='ann';await TTS.speak('OK! Thank you.','ann');G.talk=null;
  }else{
   ann.mood='oops';SFX.play('bad');G.talk='ann';await TTS.speak('Oh? Is this right?','ann');G.talk=null;
   UI.toast('Ann 照你說的做了,但好像不是你要的。再試一次!');
   await sleep(500);G.st.timerText='00:00';G.st.timerOn=false;G.st.water=0;
   ann.tx=getNpc('ann').x;
  }
 },
 async annDo(act,dec){
  const ann=getNpc('ann');
  const objFor={wash:'sink',gloves:'gloves',timer:'timer',spice:'pot',careful:'pot'};
  const ob=G.objs.find(o=>o.id===objFor[act]);
  if(ob&&Math.abs(ann.x-(ob.x-80))>6){ann.tx=ob.x-80;await this.until(()=>Math.abs(ann.x-ann.tx)<5,5000);}
  switch(act){
   case'wash':G.st.water=1.7;SFX.play('water');ann.raise=1;await sleep(1500);ann.raise=0;break;
   case'gloves':ann.raise=.8;SFX.play('whoosh');await sleep(550);ann.gloves=true;ann.raise=0;await sleep(300);break;
   case'timer':G.st.timerText=(dec&&dec.num!=null?pad2(dec.num):'15')+':00';G.st.timerOn=true;SFX.play('beep');await sleep(1100);break;
   case'spice':G.st.spiceIn=true;G.st.pot=true;SFX.play('water');await sleep(1000);break;
   case'careful':ann.tx=ann.x-70;SFX.play('whoosh');await sleep(900);break;
  }
 },

/* ================= 休息區:跑酷 / 射氣球 / 聽音射氣球 ================= */
/* 粒子(給非地圖場景用) */
function stepParticles(dt,c){
 G.particles.forEach(q=>{q.vy+=520*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.rot+=dt*6;});
 G.particles=G.particles.filter(q=>q.life>0);
 if(c)G.particles.forEach(q=>{c.save();c.translate(q.x,q.y);c.rotate(q.rot);c.globalAlpha=Math.min(1,q.life*1.5);c.fillStyle=q.c;c.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);c.restore();});
}

const Relax={
 st:null,coinCap:30,runCap:90,
 earn(n){const room=Math.max(0,this.runCap-(G.relaxCoins||0));const g=Math.max(0,Math.min(n,this.coinCap,room));G.relaxCoins=(G.relaxCoins||0)+g;G.coins+=g;UI.refresh();if(g>0)SFX.play('coin');return g;},
 xy(e){const r=UI.stageEl.getBoundingClientRect();return{x:(e.clientX-r.left)/(r.width/W),y:(e.clientY-r.top)/(r.height/H)};},

 /* 進入一個休息小遊戲,結束後顯示結果 */
 async play(kind){
  G.lock=true;UI.act(null);UI.hint(false);UI.closeModal();UI.showPad(false);G.scene='relax';G.particles=[];
  const info={run:['🏃 跑酷 Dash','點螢幕任何地方<b>跳</b>!跳過水桶和黃色警示牌,吃金幣。<br>撞到只會慢一下,不會失敗。'],
   pop:['🎈 射氣球 Balloons','點氣球把它<b>射破</b>!金色氣球有額外獎勵。<br>45 秒,輕鬆玩。'],
   lis:['🎧 聽音射氣球 Listen & Pop','聽到單字,<b>射對應的氣球</b>。每題只有 3 發,亂射會用光!<br>共 8 題(這個會記錄成聽力加練)。']}[kind];
  const ok=await new Promise(res=>{
   const box=h('div','',`<div style="font-size:16px;line-height:1.55;margin:4px 0 10px">${info[1]}</div><div class="row" style="justify-content:center;gap:12px"><button class="btn gray" id="rNo">取消</button><button class="btn red" id="rGo" style="min-width:150px">▶ 開始</button></div>`);
   const m=UI.modal(box,{title:info[0],closable:false});
   $('#rGo',box).onclick=()=>{SFX.init();m.close();res(true);};$('#rNo',box).onclick=()=>{m.close();res(false);};
  });
  let r=null;
  if(ok){
   const s=this.st={kind:kind,t:0,dur:{run:60,pop:45,lis:0}[kind],over:false,done:null};
   if(kind==='run')this.initRun();else if(kind==='pop')this.initPop();
   if(kind==='lis'){r=await this.runLis();}
   else{r=await new Promise(res=>{s.done=res;});}
  }
  this.st=null;G.scene='world';UI.showPad(true);G.near=null;
  if(!r)return;
  const got=this.earn(r.coins);
  if(kind==='lis')Rec.addGame('pop',r.c,r.t,r.score);
  await new Promise(res=>{
   const left=Math.max(0,this.runCap-(G.relaxCoins||0));
   const box=h('div','',`<div style="text-align:center"><div style="font-size:30px;font-weight:900;color:#3f9d6a">${kind==='lis'?'🎯 '+r.c+' / '+r.t+' 題一次射對':(kind==='run'?'🏃 跑了 '+Math.round(r.dist/10)+' 公尺':'🎈 射破 '+r.pops+' 顆')}</div>
    <div style="font-size:22px;margin:8px 0">🪙 +${got} 金幣 ${got<r.coins?'<span class="mut" style="font-size:14px">(每次最多 '+this.coinCap+')</span>':''}</div>
    <div class="mut" style="font-size:13px;margin-bottom:10px">休息區今天最多再賺 ${left} 枚。休息夠了就回去闖關吧!</div>
    <div class="row" style="justify-content:center"><button class="btn green" id="rOk" style="min-width:160px">好 ▶</button></div></div>`);
   const m=UI.modal(box,{title:'休息結束',closable:false});SFX.play('fan');
   $('#rOk',box).onclick=()=>{m.close();res();};
  });

 /* ---------- 跑酷 ---------- */
 initRun(){
  Object.assign(this.st,{dist:0,speed:230,py:0,vy:0,onGround:true,jumpReq:0,inv:0,items:[],next:300,coins:0,pops:0,stumble:0});
 },
 /* ---------- 射氣球(輕鬆) ---------- */
 initPop(){
  Object.assign(this.st,{balloons:[],spawn:0,pops:0,golds:0,coins:0,puffs:[]});
 },
 tap(e){
  const s=this.st;if(!s||s.over)return;const p=this.xy(e);
  if(s.kind==='run'){s.jumpReq=.14;return;}
  if(s.kind==='pop'){
   let hit=null,bd=1e9;s.balloons.forEach(b=>{const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<b.r+12&&d<bd){bd=d;hit=b;}});
   if(hit){hit.dead=true;s.pops++;if(hit.gold){s.golds++;SFX.play('golden');UI.popup('+3 🪙',hit.x,hit.y);confetti(hit.x,hit.y,22);}else{SFX.play('pop');confetti(hit.x,hit.y,8);}
    s.coins=Math.floor(s.pops/2)+s.golds*3;}
   else{s.puffs.push({x:p.x,y:p.y,t:.25});SFX.play('miss');}
   return;
  }
  if(s.kind==='lis'&&s.ammo>0&&s.phase==='play'){
   let hit=null,bd=1e9;s.balloons.forEach(b=>{if(b.dead)return;const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<b.r+14&&d<bd){bd=d;hit=b;}});
   s.ammo--;
   if(!hit){s.puffs.push({x:p.x,y:p.y,t:.25});SFX.play('miss');if(s.ammo<=0)this.endRound(false);return;}
   hit.dead=true;SFX.play('pop');confetti(hit.x,hit.y,10);
   if(hit.sp.id===s.target.id){const bonus=Math.round(clamp(1-s.tRound/s.maxT,0,1)*40);Game.right(100+bonus,hit.x,hit.y);this.endRound(true,hit.sp);}
   else{Game.wrong(hit.x,hit.y);if(s.ammo<=0)this.endRound(false);}
  }
 },
 endRound(ok){const s=this.st;if(!s||s.phase!=='play')return;s.phase='between';s.balloons.forEach(b=>{if(!b.dead&&b.sp&&b.sp.id!==s.target.id)b.fade=true;});const f=s.resolve;s.resolve=null;f&&f(ok);},

 update(dt,t){
  const s=this.st;if(!s){stepParticles(dt);return;}
  stepParticles(dt);
  s.puffs&&s.puffs.forEach(p=>p.t-=dt);s.puffs&&(s.puffs=s.puffs.filter(p=>p.t>0));
  if(s.kind==='run'){
   if(s.over)return;
   s.t+=dt;s.speed=Math.min(340,s.speed+dt*3);const dx=s.speed*dt;s.dist+=dx;
   if(s.inv>0)s.inv-=dt;
   if(s.jumpReq>0){s.jumpReq-=dt;if(s.onGround){s.vy=-640;s.onGround=false;s.jumpReq=0;SFX.play('jump');}}
   s.vy+=1900*dt;s.py+=s.vy*dt;if(s.py>=0){s.py=0;s.vy=0;s.onGround=true;}
   s.next-=dx;
   if(s.next<=0){
    const x0=W+60;
    if(Math.random()<.65){
     const o=pick([{k:'sign',w:34,h:46},{k:'bucket',w:32,h:36},{k:'crate',w:42,h:42}]);s.items.push({t:'obs',k:o.k,x:x0,w:o.w,h:o.h});
     for(let i=0;i<4;i++){const u=i/3;s.items.push({t:'coin',x:x0-60+i*40,y:46+Math.sin(u*Math.PI)*70});}
    }else{for(let i=0;i<5;i++)s.items.push({t:'coin',x:x0+i*36,y:30});}
    s.next=rnd(330,520);
   }
   s.items.forEach(it=>{it.x-=dx;});
   const px=140;
   s.items.forEach(it=>{
    if(it.dead)return;
    if(it.t==='coin'){if(Math.abs(it.x-px)<22&&Math.abs((GROUND-it.y)-(GROUND+s.py-45))<46){it.dead=true;s.coins++;SFX.tone(1200+Math.min(s.coins,10)*40,.08,'square',.05);UI.popup('+1',px+40,GROUND+s.py-110);}}
    else if(s.inv<=0&&Math.abs(it.x-px)<(it.w/2+13)&&(-s.py)<it.h-4){s.inv=1.2;s.speed*=.65;SFX.play('miss');s.stumble=.5;UI.popup('Oops!',px+30,GROUND-120,'bad');}
   });
   s.items=s.items.filter(it=>it.x>-80&&!it.dead);
   if(s.stumble>0)s.stumble-=dt;
   if(s.t>=s.dur){s.over=true;const f=s.done;s.done=null;f&&f({coins:Math.min(30,Math.floor(s.coins/2)),dist:s.dist,pops:0});}
  }else if(s.kind==='pop'){
   if(s.over)return;
   s.t+=dt;s.spawn-=dt;
   if(s.spawn<=0){s.spawn=rnd(.28,.55);const gold=Math.random()<.07;
    const cols=['#e85d75','#4aa3df','#f2c14e','#6cc48a','#a77bd6','#ff9a5a'];
    s.balloons.push({x:rnd(50,W-50),y:H+40,vy:rnd(45,95),r:rnd(26,34),col:gold?'#ffd23f':pick(cols),ph:rnd(0,6),gold:gold,dead:false});}
   s.balloons.forEach(b=>{b.y-=b.vy*dt;});
   s.balloons=s.balloons.filter(b=>!b.dead&&b.y>-60);
   if(s.t>=s.dur){s.over=true;const f=s.done;s.done=null;f&&f({coins:Math.min(30,s.coins),pops:s.pops});}
  }else if(s.kind==='lis'){
   if(s.phase==='play'){
    s.tRound+=dt;
    s.balloons.forEach(b=>{b.y-=b.vy*dt;});
    const tb=s.balloons.find(b=>!b.dead&&b.sp.id===s.target.id);
    const anyLeft=s.balloons.some(b=>!b.dead&&b.y>-50);
    if(!anyLeft||!tb||tb.y<-50){this.endRound(false);}
   }
  }

/* ================= 操作計時(不含對話與等待) ================= */
const Clock={
 ms:0,t:null,d:0,
 reset(){this.ms=0;this.t=null;this.d=0;},
 on(){this.d++;if(this.d===1)this.t=Date.now();},
 off(){if(this.d>0&&--this.d===0){this.ms+=Date.now()-this.t;this.t=null;}},
 total(){return this.ms+(this.t!=null?Date.now()-this.t:0);},
 fmt(){const s=Math.round(this.total()/1000);return pad2(Math.floor(s/60))+':'+pad2(s%60);}
};
function timed(o,k){
 const f=o[k];
 o[k]=function(){Clock.on();let r;try{r=f.apply(o,arguments);}catch(e){Clock.off();throw e;}
  return Promise.resolve(r).then(v=>{Clock.off();return v;},e=>{Clock.off();throw e;});};
}

  for(let r=0;r<rounds;r++){
   const acts=shuffle(DATA.tiles).slice(0,3);
   curText='First, '+acts[0].act+'. Then, '+acts[1].act+'. Finally, '+acts[2].act+'.';
   curZh='先'+acts[0].azh+',再'+acts[1].azh+',最後'+acts[2].azh+'。';
   $('#wkP',root).textContent=(r+1)+' / '+rounds;
   let k=0,mist=0,timedOut=false;
   slotsEl.innerHTML='';const slotEls=[0,1,2].map(i=>{const e=h('div','en',(i+1)+'');e.style.cssText='width:150px;height:44px;border:3px dashed #d3b48a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;background:#fff9ec;color:#b9a58b';slotsEl.appendChild(e);return e;});
   msg.textContent=G.diff==='easy'?'📝 '+curText:'🎧 聽三個步驟,照順序點設備';
   tilesEl.innerHTML='';const btns={};
   DATA.tiles.forEach(t=>{
    const b=h('button','',`<div style="font-size:30px;line-height:1.1">${t.ic}</div><div class="en" style="font-size:15px">${t.en}</div><div style="font-size:12px;color:#7a5a45;font-weight:800">${t.zh}</div>`);
    b.style.cssText='border:3px solid #ecdcc4;border-radius:14px;background:#fff;font-family:inherit;color:#3b2314;padding:2px';
    btns[t.id]=b;tilesEl.appendChild(b);
   });
   const ok=await new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;clearTimeout(tm);res(v);};
    DATA.tiles.forEach(t=>{btns[t.id].onclick=()=>{
     if(done||btns[t.id].disabled)return;SFX.init();
     if(t.id===acts[k].id){
      SFX.play('ding',k+1);btns[t.id].disabled=true;btns[t.id].style.background='#d9f5e3';btns[t.id].style.borderColor='#3f9d6a';
      slotEls[k].textContent=t.ic+' '+t.en;slotEls[k].style.borderStyle='solid';slotEls[k].style.background='#fff';slotEls[k].style.color='#3b2314';
      k++;if(k===3)fin(true);
     }else{
      mist++;Game.wrong(422,150);G.combo=0;UI.refresh();
      btns[t.id].classList.add('shake');setTimeout(()=>btns[t.id].classList.remove('shake'),400);
      msg.textContent='再聽一次,注意順序!';
      k=0;slotEls.forEach((e,i)=>{e.textContent=(i+1)+'';e.style.borderStyle='dashed';e.style.background='#fff9ec';e.style.color='#b9a58b';});
      DATA.tiles.forEach(x=>{btns[x.id].disabled=false;btns[x.id].style.background='#fff';btns[x.id].style.borderColor='#ecdcc4';});
     }
    };});
    bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;
    const t0=Date.now();bar.style.transition='width '+ms+'ms linear';bar.style.width='0%';
    const tm=setTimeout(()=>{timedOut=true;fin(false);},ms);
    this._tstart=t0;
    TTS.speak(curText,'master',.8);
   });
   const left=Math.max(0,ms-(Date.now()-this._tstart));
   bar.style.transition='none';
   msg.innerHTML='<span class="en" style="font-size:16px">'+curText+'</span><br><span style="color:#7a5a45">'+curZh+'</span>';
   if(ok){
    const first=mist===0;if(first)c++;
    Game.right(first?130:80,422,150);G.score+=Math.round(left/ms*50);UI.refresh();confetti(422,200,16);
    await TTS.speak('Good job!','ti');await sleep(1100);
   }else{
    Game.wrong(422,150);msg.innerHTML='<span style="color:#c9493d">⏰ 時間到!</span><br>'+msg.innerHTML;
    await sleep(2300);
   }
  }
  modal.close();
  return{c:c,t:rounds,score:G.score-score0};
 }
};

/* ================= 第 4 關:品評室(口說) ================= */
const Tasting={
 id:'taste',
 async run(){
  G.lock=true;UI.act(null);UI.hint(false);
  const list=DATA.tasting;
  for(let i=0;i<list.length;i++){
   const s=list[i];
   await Speak.run(s,{kind:'newbie',masterSay:s.masterSay,task:s.task,progress:(i+1)+' / '+list.length});
  }
  return{c:null};
 }
};
